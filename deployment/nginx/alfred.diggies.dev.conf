server {
    listen 80;
    listen [::]:80;
    server_name alfred.diggies.dev;

    client_max_body_size 1m;

    location / {
        # Alfred displays decrypted PMS data.  Keep it private even though it
        # is served through a public DNS name.
        auth_basic "Alfred";
        auth_basic_user_file /etc/nginx/.htpasswd-alfred;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
